apiVersion: apps/v1
kind: Deployment
metdata:
  name: ml-api-deployment
  label:
    app: ml-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
    spec:
      containers:
        - name: ml-api-container
          image: ghcr.io/w4rftx5gfh-afk/cicd:latest
          imagePullPolicy: Always
          ports:
          - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1 
kind: Service 
metdata:
  name: ml-api-service
spec: 
  type: NodePort
  selector:
    app: ml-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080